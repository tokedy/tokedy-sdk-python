[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokedy"
dynamic = ["version"]
description = "Official Python library and command-line tool for Tokedy AI compute."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tokedy, Inc.", email = "support@tokedy.ai" }]
requires-python = ">=3.9"
dependencies = ["openai>=1.0"]
keywords = ["tokedy", "llm", "openai", "chat", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://tokedy.ai/developers"
Documentation = "https://tokedy.ai/docs"
Source = "https://github.com/tokedy/tokedy-sdk-python"
Changelog = "https://github.com/tokedy/tokedy-sdk-python/blob/main/CHANGELOG.md"

[project.scripts]
tokedy = "tokedy.cli:main"

[tool.hatch.version]
path = "src/tokedy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tokedy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100
